<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding Elements and Removing</title>
</head>
<body style="background-color: #212121;color: #fff;">
    
</body>
<script>

    const div = document.createElement('div');
    console.log(div);
    div.className = "main";
    // div.id = "myId";
    div.id = Math.round(Math.random()*10+1);
    div.setAttribute("title" , "generated title");
    div.style.backgroundColor = "green";
    div.style.padding = "14px";
    // div.innerText = "This text is using Inner HTML";\
    // ==> this is also a way of writing , but dont use this as it is slow as compared to other method kyuki iss mai innerText ek baar value le ke aata hai phir uss mai wapis value ko overwrite kar ke set karta hai , aisa karne mai uski 2 chakker lag jaate hai hence time zada iss liye hum text node bana ke uss ko append kar dete hai

    const myText = document.createTextNode("This text is made using textNode");
    div.appendChild(myText);
    document.body.appendChild(div);

</script>
</html>
