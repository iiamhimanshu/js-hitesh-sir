<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTH-8">
        <title>DOM | Chai and Code</title>
    </head>
    <body style="background-color: #212121 ; color: #fff ">
        <div class="parent">
            <!-- here i am making an comment to what changes come in nodes -->
            <div class="day">Monday</div>
            <div class="day">Tuesday</div>
            <div class="day">Wednesday</div>
            <div class="day">Thusday</div>
        </div>
    </body>
    <script>
        const parent = document.querySelector(".parent");
        console.log(parent) // ==> puri parent class mile gi
        console.log(parent.children);  // ==> this will give html collection
        // console.log(parent.children[1]);  
        // console.log(parent.children[1].innerHTML); 
        // console.log(parent.children[1].innerText);

        for(let i = 0 ; i < parent.children.length ; i++){
            console.log(parent.children[i].innerText);
        }

        for(let i = 0 ; i < parent.children.length ; i+=2){
            parent.children[i].style.color = "orange";
        }

        for(let i = 1 ; i < parent.children.length ; i+=2){
            parent.children[i].style.fontStyle = "italic";
        }

        // console.log(parent.firstElementChild); 
        // console.log(parent.lastElementChild);
        // also one of the ways to selecting child

        // now we are going to select child and from there we are going to go to the parent

        console.log(document.querySelector(".day"));
        const dayOne = document.querySelector(".day");
        console.log(dayOne.parentElement);
        console.log(dayOne.nextElementSibling.innerHTML);

        console.log("Nodes :- ",parent.childNodes);
    </script>
</html>
